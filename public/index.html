<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>listing-desk · 商品库</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">LD</span>
      <div>
        <h1>listing-desk</h1>
        <p class="sub">1688 采集 → 美客多刊登草稿</p>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="status" id="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">检查中…</span>
      </div>
      <button class="btn ghost" id="btnQueue">任务队列<span class="pill" id="queuePill" hidden>0</span></button>
      <button class="btn ghost" id="btnOpenChrome">打开 Chrome 登录 1688</button>
      <button class="btn ghost" id="btnSettings">设置</button>
    </div>
  </header>

  <main class="page">
    <!-- 列表视图 -->
    <section class="view" id="viewList">
      <section class="panel collect-panel">
        <h2>采集</h2>
        <p class="hint">每行一个 1688 商品链接，也支持直接粘贴商品 ID。提交后进后台队列，可以继续操作，不用等它跑完。</p>
        <textarea id="urls" placeholder="https://detail.1688.com/offer/123456789.html&#10;https://detail.1688.com/offer/987654321.html"></textarea>
        <div class="row">
          <button class="btn primary" id="btnCollect">加入队列</button>
          <button class="btn ghost" id="btnScanCart">采集购物车</button>
          <button class="btn ghost" id="btnClear">清空</button>
          <span class="progress" id="progress"></span>
        </div>
      </section>

      <section class="panel queue-panel" id="queuePanel" hidden>
        <div class="panel-head">
          <h3>任务队列 <span class="q-summary" id="queueSummary"></span></h3>
          <div class="row">
            <button class="btn ghost small" id="btnClearJobs">清除已完成</button>
          </div>
        </div>
        <div class="queue-list" id="queueList"></div>
      </section>

      <div class="list-toolbar">
        <h2 class="list-title">商品库<span class="count" id="productCount"></span></h2>
        <div class="row">
          <button class="btn ghost small" id="btnRefresh">刷新</button>
          <button class="btn ghost small" id="btnExportCsv">导出 CSV</button>
        </div>
      </div>

      <div class="filter-bar">
        <input id="searchBox" type="search" placeholder="搜索标题或商品 ID" />
        <select id="filterSelect">
          <option value="all">全部商品</option>
          <option value="pdd-not">未上架拼多多</option>
          <option value="pdd-listed">已上架拼多多</option>
          <option value="dy-not">未上架抖音</option>
          <option value="dy-listed">已上架抖音</option>
          <option value="none-listed">两个平台都未上架</option>
          <option value="pending">媒体未完成</option>
          <option value="failed">有下载失败</option>
          <option value="warned">有检查提示</option>
        </select>
        <select id="sortSelect">
          <option value="new">最新采集</option>
          <option value="price-desc">价格从高到低</option>
          <option value="price-asc">价格从低到高</option>
          <option value="title">标题 A-Z</option>
        </select>
        <label class="select-all"><input type="checkbox" id="selectAll" />全选</label>
      </div>

      <div class="batch-bar" id="batchBar" hidden>
        <span id="batchCount">已选 0 件</span>
        <button class="btn ghost small" id="btnBatchRecollect">批量重采</button>
        <button class="btn ghost small" id="btnBatchExport">导出所选</button>
        <button class="btn danger small" id="btnBatchDelete">批量删除</button>
        <button class="btn ghost small" id="btnBatchClear">取消选择</button>
      </div>

      <div class="product-grid" id="productGrid"></div>
    </section>

    <!-- 详情视图 -->
    <section class="view" id="viewDetail" hidden>
      <div class="detail-nav">
        <a class="back-link" href="#/products">← 返回商品列表</a>
        <div class="detail-pager" id="detailPager" hidden>
          <button class="btn ghost small" id="btnPrevProduct" type="button">← 上一件</button>
          <span class="pager-pos" id="detailPagerPos"></span>
          <button class="btn ghost small" id="btnNextProduct" type="button">下一件 →</button>
        </div>
      </div>
      <div class="detail-head">
        <h2 id="detailTitle">商品详情</h2>
        <div class="marks-bar" id="marksBar" hidden></div>
        <div class="row" id="resultActions" hidden>
          <span class="pdd-price">
            平台
            <select id="fillPlatform" title="选择要填表的平台">
              <option value="pdd">拼多多</option>
              <option value="douyin">抖音</option>
            </select>
          </span>
          <span class="pdd-price" id="fillPddGroup">
            拼单价+
            <input id="pddGroupAdd" type="number" step="0.1" min="0" value="5" title="拼单价 = 成本价 + 该金额（元），按实填不凑尾数" />元
          </span>
          <span class="pdd-price" id="fillPddSingle">
            单买价+
            <input id="pddSingleAdd" type="number" step="0.1" min="0" value="8" title="单买价 = 成本价 + 该金额（元），自动保证比拼单价高 1 元" />元
          </span>
          <span class="pdd-price" id="fillDyPrice" hidden>
            加价方式
            <select id="dyPriceMode" title="选「倍率加价」按成本乘倍数，选「单买加价」按成本加金额">
              <option value="markup">倍率加价</option>
              <option value="add">单买加价</option>
            </select>
            <span id="dyPriceLabel">加价倍数</span>
            <input id="dyPriceValue" type="number" step="0.05" min="1" value="1.6" title="售卖价 = 成本价 × 该倍数，价格尾数凑 .9" />
          </span>
          <span class="fill-preview" id="fillPricePreview"></span>
          <button class="btn primary small" id="btnAutoFill">自动填表</button>
          <button class="btn ghost small" id="btnCopyJson">复制草稿 JSON</button>
          <button class="btn ghost small" id="btnCopyTitle">复制标题</button>
          <button class="btn ghost small" id="btnCopyImages">复制图片链接</button>
          <button class="btn danger small" id="btnDelete">删除商品</button>
        </div>
      </div>
      <div id="resultBody" class="result-body"></div>
    </section>
  </main>

  <dialog id="cartDialog">
    <div class="dialog-body">
      <h2>采集购物车</h2>
      <p class="hint" id="cartSummary">——</p>
      <div class="cart-list" id="cartList"></div>
      <div class="row">
        <button class="btn primary" id="btnCartConfirm">开始采集</button>
        <button class="btn ghost" id="btnCartCancel">取消</button>
      </div>
    </div>
  </dialog>

  <dialog id="confirmDialog">
    <div class="dialog-body">
      <h2 id="confirmTitle">确认</h2>
      <p class="hint" id="confirmMessage">——</p>
      <div class="row">
        <button class="btn danger" id="btnConfirmOk">确认</button>
        <button class="btn ghost" id="btnConfirmCancel">取消</button>
      </div>
    </div>
  </dialog>

  <dialog id="pddDialog">
    <div class="dialog-body">
      <h2 id="fillDialogTitle">拼多多填表结果</h2>
      <p class="hint" id="pddSummary">——</p>
      <div id="pddReport" class="pdd-report"></div>
      <div class="row">
        <button class="btn primary" id="btnPddClose" value="close">知道了</button>
      </div>
    </div>
  </dialog>

  <dialog id="lightboxDialog" class="lightbox-dialog">
    <div class="lightbox-body">
      <div class="lightbox-head">
        <span id="lightboxTitle">图片预览</span>
        <div class="row">
          <button class="btn ghost small" id="btnLightboxTop" type="button" hidden>设为首图</button>
          <button class="btn danger small" id="btnLightboxDelete" type="button" hidden>删除</button>
          <button class="btn ghost small" id="btnLightboxClose" type="button">关闭</button>
        </div>
      </div>
      <div class="lightbox-stage">
        <button class="lightbox-nav prev" id="btnLightboxPrev" type="button" title="上一张 (←)">‹</button>
        <img id="lightboxImg" alt="预览大图" />
        <button class="lightbox-nav next" id="btnLightboxNext" type="button" title="下一张 (→)">›</button>
      </div>
      <div class="lightbox-foot" id="lightboxMeta"></div>
    </div>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-body">
      <h2>设置</h2>
      <label>美客多站点
        <select id="cfgSite">
          <option value="MLM">MLM 墨西哥</option>
          <option value="MLB">MLB 巴西</option>
          <option value="MLA">MLA 阿根廷</option>
          <option value="MLC">MLC 智利</option>
          <option value="MCO">MCO 哥伦比亚</option>
          <option value="MLU">MLU 乌拉圭</option>
          <option value="MPE">MPE 秘鲁</option>
        </select>
      </label>
      <div class="grid-2">
        <label>币种<input id="cfgCurrency" type="text" /></label>
        <label>汇率(CNY→目标)<input id="cfgRate" type="number" step="0.01" /></label>
        <label>加价倍数<input id="cfgMarkup" type="number" step="0.05" /></label>
        <label>价格尾数<input id="cfgEnding" type="text" placeholder=".90" /></label>
        <label>标题上限<input id="cfgTitleMax" type="number" /></label>
        <label>最少图片数<input id="cfgMinImages" type="number" /></label>
      </div>
      <div class="divider"></div>
      <h2>登录态快照</h2>
      <p class="hint" id="authSnapshotInfo">——</p>
      <div class="row">
        <button type="button" class="btn ghost small" id="btnAuthExport">备份登录态</button>
        <button type="button" class="btn ghost small" id="btnAuthDownload">下载快照</button>
        <button type="button" class="btn ghost small" id="btnAuthImport">从快照恢复</button>
        <button type="button" class="btn ghost small" id="btnAuthProbe">检查是否有效</button>
      </div>
      <div class="row">
        <button class="btn primary" id="btnSaveSettings" value="save">保存</button>
        <button class="btn ghost" value="cancel">取消</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
